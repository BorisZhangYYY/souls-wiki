<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>器物志 · 余烬法典</title>
<meta name="description" content="魂系游戏标志性武器、防具与剧情关键道具图鉴：月光大剑、不死斩、暗月大剑、三分之一脐带等。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap" media="print" onload="this.media='all'">

<body>
<div id="site-head"></div>

<section class="page-hero">
  <div class="wrap">
    <div class="kicker">RELICS &amp; ARMAMENTS</div>
    <h1>器物志</h1>
    <p>在宫崎英高的作品里，武器说明往往比过场动画讲得更多。<br>这里收录剧情上分量最重的武器、防具与关键道具，以及它们在世界观中的位置。</p>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 L21 21"/></svg>
        <input id="searchInput" type="search" placeholder="检索武器、类别、入手方式…" autocomplete="off">
      </label>
      <div class="chips" id="chips"></div>
    </div>
    <div class="count" id="count"></div>
    <div class="card-grid" id="grid"></div>
  </div>
</section>

<section class="section alt tight">
  <div class="wrap">
    <div class="notice">
      <strong>一条贯穿六部作品的线索：</strong>「月光大剑」源自 FromSoftware 1994 年的处女作《国王密令》，此后在黑暗之魂三部曲、《血源诅咒》的「月光圣剑」与《艾尔登法环》的「暗月大剑」中反复转生，且总与龙、月、以及一位女性引导者相连。在检索框输入「月光」即可把它们一次找齐。
    </div>
  </div>
</section>

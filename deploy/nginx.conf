# 余烬法典 — nginx server 配置
# 部署：sudo cp deploy/nginx.conf /etc/nginx/conf.d/ashen-codex.conf
#       sudo nginx -t && sudo systemctl reload nginx
# 站点目录默认 /var/www/ashen-codex，可按实际路径修改 root。
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/ashen-codex;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/ashen-codex.access.log;
    error_log  /var/log/nginx/ashen-codex.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css text/html application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
